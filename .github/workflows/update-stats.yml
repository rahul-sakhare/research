name: Update site stats (daily)

on:
  schedule:
    - cron: '23 5 * * *'      # every day, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Refresh Google Scholar stats
        run: python scripts/update_scholar.py

      - name: Refresh downloads & views
        run: python scripts/update_metrics.py

      - name: Commit if changed
        run: |
          git config user.name "stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar.json metrics.json
          if git diff --cached --quiet; then
            echo "No stat changes."
          else
            git commit -m "chore: refresh site stats"
            git push
          fi
