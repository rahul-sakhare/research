name: Update download metrics

on:
  schedule:
    - cron: '17 6 * * 1'      # every Monday, 06:17 UTC
  workflow_dispatch:            # allows manual "Run workflow"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Refresh metrics
        run: python scripts/update_metrics.py

      - name: Commit if changed
        run: |
          git config user.name "metrics-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.json
          if git diff --cached --quiet; then
            echo "No metric changes."
          else
            git commit -m "chore: refresh download metrics"
            git push
          fi
